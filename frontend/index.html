<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOEC Workflow Agent - SANAS Accredited Calibration Laboratory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 500: '#f59e0b', 400: '#fbbf24', 300: '#fcd34d' },
            emerald: { 500: '#10b981', 400: '#34d399', 300: '#6ee7b7' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0e0f11; color: #f4f4f5; margin: 0; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const nowTs = new Date().toLocaleString("en-ZA", { hour12: false }).replace(",", "") + " SAST";

    const mockIntake = [
      { id: "1", name: "BOEC-REM-2024-084_CLIENT.xlsx", type: "submission", size: "42.8 KB", ts: "2024-11-14 08:23:11 SAST", imported_at: "2024-11-14 08:23:11 SAST", checksum: "a3f9c1e2b4d6...", status: "validated" },
      { id: "2", name: "BOEC-REM-2024-084_RAW.xlsx", type: "rawdata", size: "128.4 KB", ts: "2024-11-14 08:23:44 SAST", imported_at: "2024-11-14 08:23:44 SAST", checksum: "f8e2a9c7d1b3...", status: "validated" }
    ];

    const mockExtracted = [
      { field: "Client Name", source: "Submission!B4", value: "Eskom Koeberg Nuclear Power Station", confidence: 99.2, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Instrument ID", source: "Submission!B7", value: "BOEC-REM-2024-084", confidence: 100.0, editable: false, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Instrument Model", source: "Submission!B8", value: "Thermo Fisher RadEye PRD-ER", confidence: 98.5, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Serial Number", source: "Submission!B9", value: "PRD-ER-88471", confidence: 99.8, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Calibration Date", source: "RawData!A2", value: "2024-11-14", confidence: 100.0, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Technician", source: "Submission!B12", value: "J. Van der Merwe (SANAS Auth: TM-042)", confidence: 97.3, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Environmental - Temp", source: "RawData!D2:D8 avg", value: "21.3 °C", confidence: 96.1, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Environmental - Humidity", source: "RawData!E2:E8 avg", value: "48.2 %RH", confidence: 95.8, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Environmental - Pressure", source: "RawData!F2:F8", value: "1012.4 hPa", confidence: 94.7, editable: true, flag: "warn", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Ref Standard", source: "Submission!B15", value: "Cs-137 S/N CS-2023-11 (Traceable to NMISA)", confidence: 99.0, editable: false, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Procedure", source: "Registry", value: "CP-02-08 Rev 4.2 / CP-03-07 Rev 2.1", confidence: 100.0, editable: false, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Irradiation 0.5 mSv/h", source: "RawData!B2", value: "0.512 mSv/h (ref 0.500)", confidence: 98.9, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Irradiation 2 mSv/h", source: "RawData!B3", value: "2.043 mSv/h (ref 2.000)", confidence: 98.7, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" },
      { field: "Irradiation 10 mSv/h", source: "RawData!B4", value: "10.18 mSv/h (ref 10.00)", confidence: 98.2, editable: true, flag: "ok", extracted_at: "2024-11-14 08:24:02 SAST" }
    ];

    const mockValidation = [
      { rule: "Mandatory Field Completeness", category: "TR-18 §4.1", status: "pass", severity: "Critical", detail: "14/14 required fields present. No nulls." },
      { rule: "Temp Range 18-24°C", category: "ISO 4037-3 §6.2", status: "pass", severity: "Critical", detail: "Measured 21.3°C within [18.0-24.0] tolerance." },
      { rule: "Humidity Range 30-60%RH", category: "ISO 4037-3 §6.2", status: "pass", severity: "Critical", detail: "48.2%RH within operational envelope." },
      { rule: "Pressure Range 860-1060 hPa", category: "Lab SOP CP-02-08", status: "pass", severity: "Warning", detail: "1012.4 hPa - nominal. Sensor drift flag cleared." },
      { rule: "Dose Rate Monotonicity", category: "ISO 4037-3 §8.3", status: "pass", severity: "Critical", detail: "Response linear R²=0.9994 monotonic increase verified." },
      { rule: "Date Logic (Cal < Due)", category: "ISO/IEC 17025 §7.8.2", status: "pass", severity: "Critical", detail: "Cal 2024-11-14 < Due 2025-11-14 - valid." },
      { rule: "Template Compatibility MCC15-07 v2.1", category: "Doc Control", status: "pass", severity: "Info", detail: "Instrument type REM matched to MCC15 template." },
      { rule: "Traceability Chain", category: "SANAS TR-18", status: "pass", severity: "Critical", detail: "NMISA cert 2023-11-0445 valid until 2025-02-15." },
      { rule: "Uncertainty Budget k=2", category: "ISO 4037-3 Annex A", status: "warn", severity: "Warning", detail: "U=4.2% at 10mSv/h - within limit but review recommended." }
    ];

    const mockAudit = [
      { id: "AUD-0001", ts: "2024-11-14 08:22:03", actor: "operator.jvdm@boec.local", action: "System boot - Ryzen 5 8600G | 32GB DDR5 | iGPU NPU online", hash: "sha256:e4a1...", stage: "SYSTEM" },
      { id: "AUD-0002", ts: "2024-11-14 08:23:11", actor: "operator.jvdm@boec.local", action: "Intake validated: BOEC-REM-2024-084_CLIENT.xlsx", hash: "sha256:a3f9...", stage: "S1" },
      { id: "AUD-0003", ts: "2024-11-14 08:23:44", actor: "operator.jvdm@boec.local", action: "Intake validated: BOEC-REM-2024-084_RAW.xlsx", hash: "sha256:f8e2...", stage: "S1" }
    ];

    function App() {
      const [view, setView] = useState("dashboard");
      const [workflowStage, setWorkflowStage] = useState(1);
      const [backendUrl, setBackendUrl] = useState(() => localStorage.getItem("boec_backend_url") || (window.location.origin.includes("http") ? window.location.origin : "http://localhost:8000"));
      const [apiOnline, setApiOnline] = useState(false);
      const [dataSource, setDataSource] = useState("simulation");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [jobId, setJobId] = useState("JOB-2024-084");
      const [intakeFiles, setIntakeFiles] = useState(mockIntake);
      const [extracted, setExtracted] = useState(mockExtracted);
      const [liveValidation, setLiveValidation] = useState(null);
      const [audit, setAudit] = useState(mockAudit);
      const [liveAudit, setLiveAudit] = useState(null);
      const [liveCerts, setLiveCerts] = useState([]);
      const [selectedTemplate, setSelectedTemplate] = useState("MCC15-07 v2.1");
      const [isSigned, setIsSigned] = useState(false);
      const [showOperatorModal, setShowOperatorModal] = useState(false);
      const [showDataModal, setShowDataModal] = useState(null); // Modal data inspector
      const [parsingProgress, setParsingProgress] = useState(100);
      const [searchQuery, setSearchQuery] = useState("");
      const [generatedCert, setGeneratedCert] = useState(null);
      const [stagedSubmission, setStagedSubmission] = useState(null);
      const [stagedRaw, setStagedRaw] = useState(null);
      const subInputRef = useRef(null);
      const rawInputRef = useRef(null);

      useEffect(() => {
        localStorage.setItem("boec_backend_url", backendUrl);
      }, [backendUrl]);

      const apiFetch = async (endpoint, options = {}) => {
        try {
          const res = await fetch(`${backendUrl}${endpoint}`, options);
          if (res.ok) {
            setApiOnline(true);
            setDataSource("live");
            return await res.json();
          } else {
            setApiOnline(false);
            setDataSource("simulation");
            return null;
          }
        } catch (err) {
          setApiOnline(false);
          setDataSource("simulation");
          return null;
        }
      };

      useEffect(() => {
        const poll = async () => {
          const health = await apiFetch("/health");
          if (health) {
            const auditData = await apiFetch("/api/audit?limit=100");
            if (Array.isArray(auditData) && auditData.length > 0) {
              setLiveAudit(auditData);
            }
            const certsData = await apiFetch("/api/certs");
            if (certsData && certsData.certificates) {
              setLiveCerts(certsData.certificates);
            }
          }
        };
        poll();
        const interval = setInterval(poll, 5000);
        return () => clearInterval(interval);
      }, [backendUrl]);

      const addAudit = async (action, stage) => {
        const newEntry = {
          id: `AUD-${String((liveAudit || audit).length + 1).padStart(4, "0")}`,
          ts: new Date().toLocaleString("en-ZA", { hour12: false }).replace(",", ""),
          actor: "operator.jvdm@boec.local",
          action: action,
          hash: `sha256:${Math.random().toString(16).slice(2, 10)}...`,
          stage: stage
        };
        setAudit(prev => [newEntry, ...prev]);
      };

      const handleFileUpload = async (subFile, rawFile) => {
        setParsingProgress(20);
        if (apiOnline) {
          const formData = new FormData();
          formData.append("submission_file", subFile);
          formData.append("rawdata_file", rawFile);

          const res = await apiFetch("/api/upload", { method: "POST", body: formData });
          if (res && res.files) {
            setIntakeFiles(res.files);
            setJobId(res.job_id);
            setParsingProgress(100);

            const extractRes = await apiFetch("/api/extract", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ job_id: res.job_id, files: res.files })
            });
            if (extractRes && extractRes.extracted) {
              setExtracted(extractRes.extracted);
            }

            const valRes = await apiFetch("/api/validate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ job_id: res.job_id, extracted: extractRes?.extracted || extracted })
            });
            if (valRes && valRes.validation) {
              setLiveValidation(valRes.validation);
            }

            setWorkflowStage(2);
            setView("stage2");
            return;
          }
        }

        setParsingProgress(100);
        const simFiles = [
          { id: "1", name: subFile.name, type: "submission", size: `${(subFile.size/1024).toFixed(1)} KB`, ts: new Date().toLocaleString("en-ZA"), checksum: "sha256:a3f9...", status: "validated" },
          { id: "2", name: rawFile.name, type: "rawdata", size: `${(rawFile.size/1024).toFixed(1)} KB`, ts: new Date().toLocaleString("en-ZA"), checksum: "sha256:f8e2...", status: "validated" }
        ];
        setIntakeFiles(simFiles);
        addAudit(`Intake validated (Simulation): ${subFile.name} + ${rawFile.name}`, "S1");
        setWorkflowStage(2);
        setView("stage2");
      };

      const handleGenerateCert = async () => {
        if (apiOnline) {
          const res = await apiFetch("/api/generate-cert", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ job_id: jobId, template: selectedTemplate.includes("MCC15") ? "MCC15" : "MCC16", extracted, validation: liveValidation || mockValidation })
          });
          if (res && res.cert_no) {
            setGeneratedCert(res);
            return;
          }
        }
        setGeneratedCert({
          cert_no: "BOEC-CAL-2024-084",
          hash: "sha256:9c2e4f8b1a3d...",
          created_at: new Date().toLocaleString("en-ZA"),
          status: "draft"
        });
      };

      const handleSign = async () => {
        setIsSigned(true);
        if (apiOnline) {
          await apiFetch("/api/sign", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ job_id: jobId, cert_no: generatedCert?.cert_no || "BOEC-CAL-2024-084", operator: "J. Van der Merwe TM-042" })
          });
        }
        addAudit("Approved Final Release & Applied Digital Signature (RSA2048)", "S4->S5");
        setWorkflowStage(5);
      };

      const downloadPDF = (certNo = "BOEC-CAL-2024-084") => {
        const targetUrl = apiOnline ? `${backendUrl}/api/certs/${certNo}/download-pdf` : `${backendUrl}/api/download/${certNo}?format=pdf`;
        window.open(targetUrl, "_blank");
      };

      const filteredExtracted = extracted.filter(item =>
        item.field.toLowerCase().includes(searchQuery.toLowerCase()) ||
        item.value.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const activeValidation = liveValidation || mockValidation;
      const activeAudit = liveAudit || audit;

      return (
        <div className="min-h-screen bg-[#0e0f11] text-zinc-100 font-sans antialiased selection:bg-amber-500/30 flex flex-col">
          {/* TOP HEADER */}
          <header className="h-[56px] border-b border-zinc-800 bg-[#16181b] sticky top-0 z-50 flex items-center px-4 justify-between">
            <div className="flex items-center gap-2 md:gap-3">
              <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden text-zinc-300 hover:text-white p-1 text-lg">
                <i className={`bi ${mobileMenuOpen ? 'bi-x-lg' : 'bi-list'}`}></i>
              </button>
              <div className="w-8 h-8 bg-amber-500 rounded flex items-center justify-center font-bold text-black text-sm shrink-0">
                <i className="bi bi-box-seam-fill"></i>
              </div>
              <div>
                <button onClick={() => { setView("dashboard"); addAudit("Returned to Dashboard", "NAV"); }} className="font-bold tracking-tight text-sm text-zinc-100 hover:text-amber-400 flex items-center gap-1 transition"><i className="bi bi-speedometer2 text-amber-400 me-1"></i>BOEC WORKFLOW AGENT</button>
                <div className="mono text-[10px] text-zinc-400 tracking-wider">SANAS • ISO4037-3 • POPIA COMPLIANT</div>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded px-2 py-1">
                <span className="mono text-[11px] text-zinc-400">Backend:</span>
                <input
                  type="text"
                  value={backendUrl}
                  onChange={(e) => setBackendUrl(e.target.value)}
                  className="bg-transparent mono text-[11px] text-amber-400 focus:outline-none w-48"
                />
              </div>
              <div className={`mono text-[10px] px-2.5 py-1 rounded border flex items-center gap-1.5 ${apiOnline ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-red-500/10 border-red-500/30 text-red-300'}`}>
                <span className={`w-2 h-2 rounded-full ${apiOnline ? 'bg-emerald-400 animate-pulse' : 'bg-red-500'}`}></span>
                {apiOnline ? 'API ONLINE' : 'API OFFLINE (SIM)'}
              </div>
              <div className="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs mono">
                JV
              </div>
            </div>
          </header>

          {!apiOnline && (
            <div className="bg-amber-500/10 border-b border-amber-500/20 px-4 py-1.5 mono text-[11px] text-amber-300 flex justify-between items-center">
              <span>⚠️ OFFLINE MODE - Local simulation - Connect backend at {backendUrl} for live pipeline</span>
              <span className="text-zinc-500">POPIA Air-Gapped Mode Active</span>
            </div>
          )}

          <div className="flex flex-1 relative">
          {/* MOBILE DRAWER OVERLAY */}
          {mobileMenuOpen && (
            <div className="md:hidden fixed inset-0 z-40 bg-black/80 backdrop-blur-sm" onClick={() => setMobileMenuOpen(false)}>
              <div className="w-[280px] h-full bg-[#121316] border-r border-zinc-800 p-4 space-y-4 overflow-auto" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <span className="mono text-xs font-bold text-amber-400">NAVIGATION MENU</span>
                  <button onClick={() => setMobileMenuOpen(false)} className="text-zinc-400"><i className="bi bi-x-lg"></i></button>
                </div>
                <div>
                  <div className="mono text-[10px] uppercase tracking-widest text-zinc-500 mb-2">WORKFLOW STAGES</div>
                  <nav className="space-y-1">
                    {[
                      { id: "dashboard", stageNum: 0, label: "Workflow Overview", icon: "bi-speedometer2" },
                      { id: "stage1", stageNum: 1, label: "Stage 1: Intake & Validation", icon: "bi-file-earmark-arrow-up" },
                      { id: "stage2", stageNum: 2, label: "Stage 2: Extraction", icon: "bi-scan" },
                      { id: "stage3", stageNum: 3, label: "Stage 3: Validation", icon: "bi-shield-check" },
                      { id: "stage4", stageNum: 4, label: "Stage 4: Certificate", icon: "bi-file-earmark-badge" },
                      { id: "stage5", stageNum: 5, label: "Stage 5: Archive", icon: "bi-database-fill-gear" },
                      { id: "templates", stageNum: 6, label: "Templates Registry", icon: "bi-collection-fill" },
                      { id: "compliance", stageNum: 7, label: "Compliance Controls", icon: "bi-diagram-3-fill" }
                    ].map(item => (
                      <button
                        key={item.id}
                        onClick={() => { setView(item.id); setMobileMenuOpen(false); addAudit(`Mobile Nav to ${item.label}`, "NAV"); }}
                        className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-xs font-medium text-left transition ${view === item.id ? 'bg-amber-500 text-black font-semibold' : 'text-zinc-300 hover:bg-zinc-800'}`}
                      >
                        <i className={`bi ${item.icon} text-sm`}></i>
                        <span className="truncate flex-1">{item.label}</span>
                      </button>
                    ))}
                  </nav>
                </div>
              </div>
            </div>
          )}
            {/* LEFT SIDEBAR */}
            <aside className="hidden md:flex w-[260px] shrink-0 border-r border-zinc-800 bg-[#121316] p-3 flex-col justify-between">
              <div className="space-y-4">
                <div>
                  <div className="mono text-[10px] uppercase tracking-widest text-zinc-500 mb-2 px-2">WORKFLOW STAGES</div>
                  <nav className="space-y-1">
                    {[
                      { id: "stage1", stageNum: 1, label: "Stage 1: Intake & Validation", icon: "bi-file-earmark-arrow-up", status: workflowStage >= 1 ? "emerald" : "zinc" },
                      { id: "stage2", stageNum: 2, label: "Stage 2: Extraction", icon: "bi-scan", status: workflowStage >= 2 ? "emerald" : "zinc" },
                      { id: "stage3", stageNum: 3, label: "Stage 3: Validation", icon: "bi-shield-check", status: workflowStage >= 3 ? "emerald" : "zinc" },
                      { id: "stage4", stageNum: 4, label: "Stage 4: Certificate", icon: "bi-file-earmark-badge", status: workflowStage >= 4 ? "amber" : "zinc" },
                      { id: "stage5", stageNum: 5, label: "Stage 5: Archive", icon: "bi-database-fill-gear", status: workflowStage >= 5 ? "emerald" : "zinc" }
                    ].map(stg => (
                      <button
                        key={stg.id}
                        onClick={() => { setView(stg.id); addAudit(`Navigated to ${stg.label}`, `S${stg.stageNum}`); }}
                        className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-left transition ${view === stg.id ? 'bg-amber-500 text-black font-semibold' : 'text-zinc-300 hover:bg-zinc-800'}`}
                      >
                        <i className={`bi ${stg.icon} text-sm`}></i>
                        <span className="truncate flex-1">{stg.label}</span>
                        <span className={`w-2 h-2 rounded-full ${stg.status === 'emerald' ? 'bg-emerald-400' : stg.status === 'amber' ? 'bg-amber-400' : 'bg-zinc-600'}`}></span>
                      </button>
                    ))}
                  </nav>
                </div>

                <div>
                  <div className="mono text-[10px] uppercase tracking-widest text-zinc-500 mb-2 px-2">REGISTRY & COMPLIANCE</div>
                  <nav className="space-y-1">
                    <button
                      onClick={() => setView("templates")}
                      className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-left transition ${view === "templates" ? 'bg-amber-500 text-black font-semibold' : 'text-zinc-300 hover:bg-zinc-800'}`}
                    >
                      <i className="bi bi-collection-fill text-sm"></i>
                      <span>Templates Registry</span>
                    </button>
                    <button
                      onClick={() => setView("compliance")}
                      className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-left transition ${view === "compliance" ? 'bg-amber-500 text-black font-semibold' : 'text-zinc-300 hover:bg-zinc-800'}`}
                    >
                      <i className="bi bi-diagram-3-fill text-sm"></i>
                      <span>Compliance Controls</span>
                    </button>
                  </nav>
                </div>
              </div>

              <div className="space-y-2 border-t border-zinc-800 pt-3 mono text-[10px] text-zinc-400">
                <div className="flex items-center gap-2 text-zinc-200">
                  <i className="bi bi-person-badge-fill text-amber-400"></i>
                  <span>J. Van der Merwe (TM-042)</span>
                </div>
                <div className="flex items-center gap-2 text-zinc-500">
                  <i className="bi bi-cpu"></i>
                  <span>Ryzen 5 8600G • 32GB DDR5</span>
                </div>
              </div>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 p-6 overflow-auto max-w-[1400px] mx-auto space-y-6">
              {/* DASHBOARD VIEW */}
              {view === "dashboard" && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <h1 className="text-xl font-bold tracking-tight text-white">Workflow Overview</h1>
                    <span className="mono text-xs text-zinc-400">BOEC Accredited Laboratory CAL-2024-07</span>
                  </div>

                  {/* 4 STAT CARDS */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {[
                      {
                        title: "Total Jobs Today",
                        val: String(intakeFiles.length),
                        sub: "Click to inspect intake files",
                        icon: "bi-briefcase-fill",
                        color: "text-amber-400",

                  <div className="flex items-center gap-3"><button onClick={() => { setView("dashboard"); addAudit("Returned to Dashboard", "NAV"); }} className="bg-zinc-800 hover:bg-zinc-700 text-amber-400 font-semibold text-xs px-3 py-1.5 rounded-lg border border-zinc-700 flex items-center gap-1.5 transition"><i className="bi bi-arrow-left"></i> Back to Dashboard</button><h1 className="text-lg font-bold text-white">Templates Registry</h1></div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                    {[
                      { name: "MCC15-07 v2.1", type: "Standard Area & REM Calibration", date: "2024-08-19", checksum: "b7e4a2f8...", status: "ACTIVE" },
                      { name: "MCC16-07 v2.1", type: "Survey Meter / EPD Calibration", date: "2024-06-11", checksum: "f3d2b1c4...", status: "ACTIVE" }
                    ].map((t, i) => (
                      <div key={i} className="bg-zinc-900/80 border border-zinc-800 rounded-xl p-5 space-y-3">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-amber-400 text-sm">{t.name}</span>
                          <span className="mono text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">{t.status}</span>
                        </div>
                        <div className="text-xs text-zinc-300">{t.type}</div>
                        <div className="mono text-[10px] text-zinc-500">Approval Date: {t.date} | SHA256: {t.checksum}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* COMPLIANCE VIEW */}
              {view === "compliance" && (
                <div className="space-y-6">
                  <div className="flex items-center gap-2">
                    <i className="bi bi-diagram-3-fill text-amber-500 text-lg"></i>
                    <div className="flex items-center gap-3"><button onClick={() => { setView("dashboard"); addAudit("Returned to Dashboard", "NAV"); }} className="bg-zinc-800 hover:bg-zinc-700 text-amber-400 font-semibold text-xs px-3 py-1.5 rounded-lg border border-zinc-700 flex items-center gap-1.5 transition"><i className="bi bi-arrow-left"></i> Back to Dashboard</button><h1 className="text-lg font-bold text-white">Compliance Controls • SANAS Audit Ready</h1></div>
                  </div>

                  <div className="bg-zinc-900/80 border border-zinc-800 rounded-xl overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-zinc-800/60 mono text-[10px] text-zinc-400 uppercase">
                        <tr>
                          <th className="p-3">Requirement Area</th>
                          <th className="p-3">Standard</th>
                          <th className="p-3">Alignment Approach</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-800/60">
                        {[
                          { area: "Document Control", std: "ISO/IEC 17025 §8.3", align: "Template versioning MCC15-07 v2.1 checksum + approval workflow" },
                          { area: "Environmental Monitoring", std: "ISO 4037-3 §6.2", align: "Range checks 18-24°C, 30-60%RH auto-validated, sensor traceability" },
                          { area: "Metrological Traceability", std: "SANAS TR-18", align: "Cs-137 chain to NMISA cert 2023-11-0445, SI via BIPM" },
                          { area: "Data Integrity", std: "ISO/IEC 17025 §7.11", align: "SHA256 checksum, hash-chained audit, SQLite WAL, encrypted FS" },
                          { area: "Data Privacy", std: "POPIA", align: "Local LLM (Ollama), no egress, PII minimization, AES-256 at rest" },
                          { area: "Impartiality & Confidentiality", std: "ISO/IEC 17025 §4", align: "Role-based access, operator sign-off, audit log immutable" }
                        ].map((row, i) => (
                          <tr key={i} className="hover:bg-zinc-800/30">
                            <td className="p-3 font-semibold text-zinc-200">{row.area}</td>
                            <td className="p-3 mono text-zinc-400">{row.std}</td>
                            <td className="p-3 text-zinc-300">{row.align}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="border border-amber-500/30 bg-amber-500/5 rounded-xl p-4 text-xs text-zinc-300 space-y-2">
                    <div className="font-semibold text-amber-400">Control Contribution Summary</div>
                    <p className="leading-relaxed">
                      Local AI eliminates 3rd-party data processor risk • FastAPI enforces naming BOEC-XXXX-YYYY • Python parser validates Excel schema before LLM • Operator checkpoints at S2 & S4 satisfy SANAS human oversight • SQLite provides tamper-evident audit, hybrid cloud gives 7yr retention per SANAS R04.
                    </p>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* DATA INSPECTION MODAL */}
          {showDataModal && (
            <div className="fixed inset-0 z-[100] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-[580px] max-w-full rounded-xl border border-zinc-700 bg-zinc-900 p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <div className="font-bold text-sm text-amber-400 flex items-center gap-2">
                    <i className="bi bi-search text-amber-500"></i>
                    <span>{showDataModal.title}</span>
                  </div>
                  <button onClick={() => setShowDataModal(null)} className="text-zinc-400 hover:text-white"><i className="bi bi-x-lg"></i></button>
                </div>
                <pre className="mono text-xs text-zinc-300 bg-zinc-800/60 p-3 rounded border border-zinc-800 max-h-80 overflow-auto whitespace-pre-wrap break-all">
                  {JSON.stringify(showDataModal.data, null, 2)}
                </pre>
                <div className="flex gap-3">
                  {showDataModal.stage && (
                    <button
                      onClick={() => {
                        const stg = showDataModal.stage;
                        setShowDataModal(null);
                        setView(stg);
                        addAudit(`Navigated to ${stg} from Stat Card modal`, "NAV");
                      }}
                      className="flex-1 bg-amber-500 hover:bg-amber-400 text-black font-semibold text-xs py-2 rounded-lg transition flex items-center justify-center gap-1.5"
                    >
                      <span>Open in {showDataModal.stage.toUpperCase()} Stage</span>
                      <i className="bi bi-arrow-right"></i>
                    </button>
                  )}
                  <button onClick={() => setShowDataModal(null)} className="px-4 bg-zinc-800 text-zinc-300 text-xs py-2 rounded-lg border border-zinc-700 hover:bg-zinc-700 transition">
                    Close Inspector
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* OPERATOR REVIEW MODAL */}
          {showOperatorModal && (
            <div className="fixed inset-0 z-[100] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-[480px] max-w-full rounded-xl border border-zinc-700 bg-zinc-900 p-5 space-y-4 shadow-2xl">
                <div className="flex items-center gap-3 border-b border-zinc-800 pb-3">
                  <i className="bi bi-shield-check text-amber-500 text-xl"></i>
                  <div>
                    <div className="font-bold text-sm text-white">Operator Review Checkpoint</div>
                    <div className="mono text-[10px] text-zinc-400">BOEC Quality Management Gate</div>
                  </div>
                </div>

                <div className="space-y-2 mono text-xs bg-zinc-800/50 p-3 rounded border border-zinc-800 text-zinc-300">
                  <div className="flex justify-between"><span>Certificate:</span> <span className="text-amber-400">{generatedCert?.cert_no || "BOEC-CAL-2024-084"}</span></div>
                  <div className="flex justify-between"><span>Validation:</span> <span className="text-emerald-400">9/9 PASSED</span></div>
                  <div className="flex justify-between"><span>Signature:</span> <span>J. Van der Merwe (TM-042)</span></div>
                  <div className="flex justify-between"><span>POPIA Mode:</span> <span className="text-emerald-400">Strict Local Enclave</span></div>
                  <div className="flex justify-between"><span>Hash Chain:</span> <span className="text-emerald-400">{generatedCert?.hash || "sha256:a3f9c1e2..."}</span></div>
                </div>

                <div className="space-y-2">
                  <button
                    onClick={() => {
                      handleSign();
                      downloadPDF(generatedCert?.cert_no || "BOEC-CAL-2024-084");
                      setShowOperatorModal(false);
                      setView("stage5");
                    }}
                    className="w-full bg-emerald-600 text-white font-semibold text-xs py-2.5 rounded-lg hover:bg-emerald-500 flex items-center justify-center gap-2"
                  >
                    <i className="bi bi-file-earmark-pdf-fill"></i> Approve & Download Signed PDF
                  </button>
                  <button
                    onClick={() => setShowOperatorModal(false)}
                    className="w-full bg-zinc-800 text-zinc-300 text-xs py-2 rounded-lg border border-zinc-700 hover:bg-zinc-700"
                  >
                    Return for Correction
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-zinc-800 bg-[#121316] py-3 text-center text-xs text-zinc-500 mono">
            Smile and Enjoy your day !
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
